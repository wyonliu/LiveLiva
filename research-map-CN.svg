text-anchor="start" font-weight="400" letter-spacing="0">技能·方法·后代版本</text><rect x="626" y="489" width="226" height="72" rx="3" fill="#f4f6f9" stroke="#d6dde7"/><text x="640" y="518" font-size="15" fill="#2d4466" text-anchor="start" font-weight="500" letter-spacing="0">独立评测</text><text x="640" y="543" font-size="11" fill="#5c6f8a" text-anchor="start" font-weight="400" letter-spacing="0">独立任务·等预算</text><rect x="924" y="489" width="226" height="72" rx="3" fill="#f4f6f9" stroke="#d6dde7"/><text x="938" y="518" font-size="15" fill="#2d4466" text-anchor="start" font-weight="500" letter-spacing="0">受控发布</text><text x="938" y="543" font-size="11" fill="#5c6f8a" text-anchor="start" font-weight="400" letter-spacing="0">晋级或回退</text><path d="M256 525H322" fill="none" stroke="#8291a6" stroke-width="1.4"  stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M554 525H620" fill="none" stroke="#8291a6" stroke-width="1.4"  stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M852 525H918" fill="none" stroke="#8291a6" stroke-width="1.4"  stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M1038 562V590H14V197H24" fill="none" stroke="#8291a6" stroke-width="1.4"  stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="585" y="609" font-size="11" fill="#607da5" text-anchor="middle" font-weight="400" letter-spacing="0">经评测的升级返回对应组件；图示为智能体升级路径。</text></g></svg>