<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img"><title>LiveLiva: people, persistent lives, shared worlds and evaluated learning</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52756e"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#947445"/></marker></defs><style>svg text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#183c37}svg .heading{font-size:19px;font-weight:700}svg .small{font-size:15px}svg .tiny{font-size:13px}svg .label{font-size:15px;font-weight:700;letter-spacing:1px}svg .line{fill:none;stroke:#52756e;stroke-width:1.8;marker-end:url(#a)}svg .research{fill:none;stroke:#947445;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#r)}</style><rect width="1200" height="780" fill="#fbfcf8"/><text x="24" y="29" class="heading" text-anchor="start">图1｜共同经历如何连接人、生命与世界</text><text x="24" y="53" class="tiny" text-anchor="start">目标架构；箭头表示设计关系，不代表全部已实现。</text><rect x="24" y="77" width="1152" height="111" rx="10" fill="#f0f2ec" stroke="#b8cabe"/><text x="42" y="100" class="label" text-anchor="start">A  人与创作来源</text><text x="64" y="132" class="heading" text-anchor="start">你与真实朋友</text><text x="64" y="157" class="small" text-anchor="start">意图 · 选择 · 共同参与</text><text x="477" y="132" class="heading" text-anchor="start">地方与人的生活</text><text x="477" y="157" class="small" text-anchor="start">自然 · 技艺 · 故事 · 日常</text><text x="886" y="132" class="heading" text-anchor="start">独立创作者</text><text x="886" y="157" class="small" text-anchor="start">表达 · 作者权益 · 持续经营</text><path d="M183 188V237" class="line"/><text x="196" y="215" class="tiny" text-anchor="start">授权与互动</text><path d="M633 188V211H993V237" class="line"/><text x="734" y="205" class="tiny" text-anchor="start">有来源的素材</text><path d="M1050 188V237" class="line"/><rect x="24" y="237" width="335" height="208" rx="10" fill="#e7f1ec" stroke="#88afa1"/><text x="42" y="262" class="label" text-anchor="start">B  女娲｜持续AI生命</text><rect x="42" y="280" width="299" height="57" rx="10" fill="#fbfcf8" stroke="#b8cabe"/><text x="57" y="304" class="heading" text-anchor="start">人本模型</text><text x="57" y="325" class="tiny" text-anchor="start">意图与情境 · 可纠正的理解</text><text x="42" y="366" class="heading" text-anchor="start">观察 → 规划 → 行动提案</text><text x="42" y="392" class="small" text-anchor="start">个性 · 记忆 · 技能</text><text x="42" y="423" class="tiny" text-anchor="start">伙伴帮助人相遇、参与和创造</text><rect x="439" y="237" width="322" height="208" rx="10" fill="#e9eff4" stroke="#9ab0c3"/><text x="457" y="262" class="label" text-anchor="start">C  伏羲｜共享世界运行时</text><rect x="457" y="280" width="286" height="57" rx="10" fill="#fbfcf8" stroke="#b8cabe"/><text x="472" y="304" class="heading" text-anchor="start">世界模型</text><text x="472" y="325" class="tiny" text-anchor="start">状态＋动作 → 预测后果</text><text x="457" y="366" class="heading" text-anchor="start">规则 · 权限 · 多人状态</text><text x="457" y="392" class="small" text-anchor="start">确认行动结果，形成事件回执</text><text x="457" y="423" class="tiny" text-anchor="start">预测供规划参考；运行时确认事实</text><path d="M359 354H439" class="line"/><text x="399" y="343" class="tiny" text-anchor="middle">提案</text><path d="M439 399H359" class="line"/><text x="399" y="420" class="tiny" text-anchor="middle">回执</text><rect x="841" y="237" width="335" height="208" rx="10" fill="#f2efe5" stroke="#c4b88d"/><text x="859" y="262" class="label" text-anchor="start">D  盘古｜世界创作与发行</text><text x="859" y="300" class="heading" text-anchor="start">空间智能＋生成式工具</text><text x="859" y="329" class="small" text-anchor="start">素材 → 场景、角色与规则</text><text x="859" y="365" class="heading" text-anchor="start">编辑 → 测试 → 版本化发行</text><text x="859" y="393" class="small" text-anchor="start">作者作品与收益记录</text><text x="859" y="423" class="tiny" text-anchor="start">世界模型辅助模拟试玩</text><path d="M841 354H761" class="line"/><text x="800" y="343" class="tiny" text-anchor="middle">世界包</text><path d="M761 399H841" class="line"/><text x="800" y="420" class="tiny" text-anchor="middle">反馈</text><path d="M183 445V480" class="line"/><path d="M600 445V480" class="line"/><path d="M1008 445V480" class="line"/><rect x="24" y="480" width="1152" height="99" rx="10" fill="#e0ece5" stroke="#88afa1"/><text x="42" y="505" class="label" text-anchor="start">E  跨世界延续｜平台积累假设</text><text x="42" y="537" class="heading" text-anchor="start">持续身份与有效历史</text><text x="42" y="559" class="tiny" text-anchor="start">模型升级后保留</text><text x="340" y="537" class="heading" text-anchor="start">可适配的能力</text><text x="340" y="559" class="tiny" text-anchor="start">依照各世界规则迁移</text><text x="623" y="537" class="heading" text-anchor="start">真人关系</text><text x="623" y="559" class="tiny" text-anchor="start">共同经历带来再次相遇</text><text x="913" y="537" class="heading" text-anchor="start">作者作品网络</text><text x="913" y="559" class="tiny" text-anchor="start">新作品扩展下一段经历</text><path d="M24 529H9V215H92V237" class="line"/><text x="42" y="612" class="label" text-anchor="start">F  学习研究｜只使用获准经历，评测通过后升级</text><rect x="24" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="38" y="654" class="heading" text-anchor="start">经历与数据资格</text><text x="38" y="680" class="tiny" text-anchor="start">授权 · 来源 · 结果</text><rect x="316" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="330" y="654" class="heading" text-anchor="start">持续学习／RSI</text><text x="330" y="680" class="tiny" text-anchor="start">技能改进／学习方法改进</text><rect x="608" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="622" y="654" class="heading" text-anchor="start">独立评测</text><text x="622" y="680" class="tiny" text-anchor="start">未见任务 · 同预算 · 保持与迁移</text><rect x="900" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="914" y="654" class="heading" text-anchor="start">发布门槛</text><text x="914" y="680" class="tiny" text-anchor="start">通过才升级 · 可回滚</text><path d="M300 662H316" class="research"/><path d="M592 662H608" class="research"/><path d="M884 662H900" class="research"/><path d="M600 579V589H15V617H160V627" class="research"/><path d="M1176 662H1191V221H326V237" class="research"/><text x="24" y="730" class="tiny" text-anchor="start">实线：设计中的运行／延续关系</text><text x="440" y="730" class="tiny" text-anchor="start">虚线：研究与评测升级路径</text><text x="24" y="757" class="tiny" text-anchor="start">已有：本地身份、状态一致性与恢复检查。待证：真人留存、作者供给、跨世界价值与学习收益。</text></svg>