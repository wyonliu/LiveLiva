<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img"><title>LiveLiva: people, persistent lives, shared worlds and evaluated learning</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52756e"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#947445"/></marker></defs><style>svg text{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;fill:#183c37}svg .heading{font-size:19px;font-weight:700}svg .small{font-size:15px}svg .tiny{font-size:13px}svg .label{font-size:15px;font-weight:700;letter-spacing:1px}svg .line{fill:none;stroke:#52756e;stroke-width:1.8;marker-end:url(#a)}svg .research{fill:none;stroke:#947445;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#r)}</style><rect width="1200" height="780" fill="#fbfcf8"/><text x="24" y="29" class="heading" text-anchor="start">FIG. 1   HOW SHARED EXPERIENCE CONNECTS PEOPLE, LIVES AND WORLDS</text><text x="24" y="53" class="tiny" text-anchor="start">Target architecture. Arrows describe intended relationships, not implementation status.</text><rect x="24" y="77" width="1152" height="111" rx="10" fill="#f0f2ec" stroke="#b8cabe"/><text x="42" y="100" class="label" text-anchor="start">A  PEOPLE &amp; SOURCES</text><text x="64" y="132" class="heading" text-anchor="start">You &amp; real friends</text><text x="64" y="157" class="small" text-anchor="start">Intent · choice · shared agency</text><text x="477" y="132" class="heading" text-anchor="start">Places &amp; lived culture</text><text x="477" y="157" class="small" text-anchor="start">Nature · craft · stories · daily life</text><text x="886" y="132" class="heading" text-anchor="start">Independent creators</text><text x="886" y="157" class="small" text-anchor="start">Expression · ownership · livelihoods</text><path d="M183 188V237" class="line"/><text x="196" y="215" class="tiny" text-anchor="start">Consent &amp; interaction</text><path d="M633 188V211H993V237" class="line"/><text x="734" y="205" class="tiny" text-anchor="start">Sourced material</text><path d="M1050 188V237" class="line"/><rect x="24" y="237" width="335" height="208" rx="10" fill="#e7f1ec" stroke="#88afa1"/><text x="42" y="262" class="label" text-anchor="start">B  NUWA · PERSISTENT AI LIFE</text><rect x="42" y="280" width="299" height="57" rx="10" fill="#fbfcf8" stroke="#b8cabe"/><text x="57" y="304" class="heading" text-anchor="start">Human model</text><text x="57" y="325" class="tiny" text-anchor="start">Intent &amp; context · correctable understanding</text><text x="42" y="366" class="heading" text-anchor="start">Observe → plan → propose actions</text><text x="42" y="392" class="small" text-anchor="start">Personality · memory · skills</text><text x="42" y="423" class="tiny" text-anchor="start">Companions help people meet, act and create</text><rect x="439" y="237" width="322" height="208" rx="10" fill="#e9eff4" stroke="#9ab0c3"/><text x="457" y="262" class="label" text-anchor="start">C  FUXI · SHARED WORLD RUNTIME</text><rect x="457" y="280" width="286" height="57" rx="10" fill="#fbfcf8" stroke="#b8cabe"/><text x="472" y="304" class="heading" text-anchor="start">World model</text><text x="472" y="325" class="tiny" text-anchor="start">State + action → predicted consequences</text><text x="457" y="366" class="heading" text-anchor="start">Rules · permissions · shared state</text><text x="457" y="392" class="small" text-anchor="start">Confirm outcomes; record event receipts</text><text x="457" y="423" class="tiny" text-anchor="start">Predictions guide plans; runtime confirms facts</text><path d="M359 354H439" class="line"/><text x="399" y="343" class="tiny" text-anchor="middle">Propose</text><path d="M439 399H359" class="line"/><text x="399" y="420" class="tiny" text-anchor="middle">Receipt</text><rect x="841" y="237" width="335" height="208" rx="10" fill="#f2efe5" stroke="#c4b88d"/><text x="859" y="262" class="label" text-anchor="start">D  PANGU · WORLD AUTHORING</text><text x="859" y="300" class="heading" text-anchor="start">Spatial intelligence + generation</text><text x="859" y="329" class="small" text-anchor="start">Sources → scenes, characters &amp; rules</text><text x="859" y="365" class="heading" text-anchor="start">Edit → test → versioned release</text><text x="859" y="393" class="small" text-anchor="start">Authored works &amp; revenue records</text><text x="859" y="423" class="tiny" text-anchor="start">World models support simulated playtests</text><path d="M841 354H761" class="line"/><text x="800" y="343" class="tiny" text-anchor="middle">World package</text><path d="M761 399H841" class="line"/><text x="800" y="420" class="tiny" text-anchor="middle">Feedback</text><path d="M183 445V480" class="line"/><path d="M600 445V480" class="line"/><path d="M1008 445V480" class="line"/><rect x="24" y="480" width="1152" height="99" rx="10" fill="#e0ece5" stroke="#88afa1"/><text x="42" y="505" class="label" text-anchor="start">E  CROSS-WORLD CONTINUITY · PLATFORM HYPOTHESIS</text><text x="42" y="537" class="heading" text-anchor="start">Identity &amp; valid history</text><text x="42" y="559" class="tiny" text-anchor="start">Persist across model upgrades</text><text x="340" y="537" class="heading" text-anchor="start">Adaptable capabilities</text><text x="340" y="559" class="tiny" text-anchor="start">Transfer under world-specific rules</text><text x="623" y="537" class="heading" text-anchor="start">Human relationships</text><text x="623" y="559" class="tiny" text-anchor="start">Shared history supports meeting again</text><text x="913" y="537" class="heading" text-anchor="start">Creator world network</text><text x="913" y="559" class="tiny" text-anchor="start">New works open new experiences</text><path d="M24 529H9V215H92V237" class="line"/><text x="42" y="612" class="label" text-anchor="start">F  LEARNING RESEARCH · AUTHORIZED EXPERIENCE, EVALUATED UPGRADES</text><rect x="24" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="38" y="654" class="heading" text-anchor="start">Eligible experience</text><text x="38" y="680" class="tiny" text-anchor="start">Consent · provenance · outcomes</text><rect x="316" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="330" y="654" class="heading" text-anchor="start">Continual learning / RSI</text><text x="330" y="680" class="tiny" text-anchor="start">Skills / learning-process improvement</text><rect x="608" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="622" y="654" class="heading" text-anchor="start">Independent evaluation</text><text x="622" y="680" class="tiny" text-anchor="start">Held-out tasks · equal budget · transfer</text><rect x="900" y="627" width="276" height="70" rx="10" fill="#faf6ee" stroke="#c5af86"/><text x="914" y="654" class="heading" text-anchor="start">Release gate</text><text x="914" y="680" class="tiny" text-anchor="start">Promote on evidence · rollback</text><path d="M300 662H316" class="research"/><path d="M592 662H608" class="research"/><path d="M884 662H900" class="research"/><path d="M600 579V589H15V617H160V627" class="research"/><path d="M1176 662H1191V221H326V237" class="research"/><text x="24" y="730" class="tiny" text-anchor="start">Solid: intended operation / continuity</text><text x="440" y="730" class="tiny" text-anchor="start">Dashed: research &amp; evaluated upgrades</text><text x="24" y="757" class="tiny" text-anchor="start">Evidence: local identity, state consistency &amp; recovery checks. Open: retention, creator supply, cross-world value &amp; learning gains.</text></svg>