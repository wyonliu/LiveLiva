<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 625" role="img" aria-labelledby="title desc"><title id="title">LiveLiva — system architecture</title><desc id="desc">Nuwa proposes actions; Fuxi confirms outcomes; Pangu publishes worlds. World models assist planning and playtests. Independent research evaluates upgrades.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#8291a6"/></marker></defs><rect width="1180" height="625" fill="#fbfcfe"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="32" font-size="10" fill="#62748d" text-anchor="start" font-weight="400" letter-spacing="1.6">PEOPLE, AGENTS &amp; WORLDS</text><text x="30" y="65" font-size="16" fill="#172b46" text-anchor="start" font-weight="500" letter-spacing="0">People &amp; personal context</text><text x="780" y="65" font-size="16" fill="#172b46" text-anchor="start" font-weight="500" letter-spacing="0">Creators, culture &amp; source material</text><path d="M167 79V111" fill="none" stroke="#8291a6" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="181" y="99" font-size="11" fill="#7a8898" text-anchor="start" font-weight="400" letter-spacing="0">intent &amp; permission</text><path d="M989 79V111" fill="none" stroke="#8291a6" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="1003" y="99" font-size="11" fill="#7a8898" text-anchor="start" font-weight="400" letter-spacing="0">author &amp; edit</text><rect x="30" y="120" width="328" height="157" rx="3" fill="#edf2fb" stroke="#bccbe3"/><rect x="426" y="120" width="328" height="157" rx="3" fill="#142840" stroke="#142840"/><rect x="822" y="120" width="328" height="157" rx="3" fill="#f0f3ec" stroke="#c9d5bc"/><text x="50" y="149" font-size="10" fill="#5274a7" text-anchor="start" font-weight="400" letter-spacing="1.4">NUWA / PERSONAL AGENTS</text><text x="50" y="184" font-size="23" fill="#182f52" text-anchor="start" font-weight=